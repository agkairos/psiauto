# Stack de infraestrutura COMPARTILHADA entre todos os projetos da VPS
# (PsiAuto e os demais que forem migrados da Railway) — cria uma vez só no
# Dokploy, como uma aplicação separada ("shared-infra"). Cada projeto ganha
# seu próprio banco/schema dentro deste MySQL, e prefixo próprio no Redis
# (REDIS_PREFIX no .env de cada app) — não uma instância de banco por app.
#
# Rodar um par de MySQL/Redis por projeto desperdiça RAM que a VPS não tem
# de sobra; consolidar aqui é o que sobra de recurso pra escalar de verdade.

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - infra

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 400mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - infra

networks:
  infra:
    name: infra
    driver: bridge

volumes:
  mysql_data:
  redis_data:
