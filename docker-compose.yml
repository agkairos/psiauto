services:
  app:
    build: .
    restart: unless-stopped
    depends_on:
      - mysql
      - redis
    env_file: .env
    ports:
      - "80"
    volumes:
      - storage:/app/storage

  worker:
    build: .
    restart: unless-stopped
    command: php artisan horizon
    depends_on:
      - mysql
      - redis
    env_file: .env
    volumes:
      - storage:/app/storage

  scheduler:
    build: .
    restart: unless-stopped
    command: php artisan schedule:work
    depends_on:
      - mysql
      - redis
    env_file: .env
    volumes:
      - storage:/app/storage

  reverb:
    build: .
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    depends_on:
      - redis
    env_file: .env
    ports:
      - "8080"

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:
  storage:
