services:
  app:
    build: .
    restart: unless-stopped
    mem_limit: 512m
    env_file: .env
    ports:
      - "80"
    volumes:
      - storage:/app/storage
    networks:
      - dokploy-network

  worker:
    build: .
    restart: unless-stopped
    mem_limit: 512m
    command: php artisan horizon
    env_file: .env
    volumes:
      - storage:/app/storage
    networks:
      - dokploy-network
    healthcheck:
      disable: true

  scheduler:
    build: .
    restart: unless-stopped
    mem_limit: 256m
    command: php artisan schedule:work
    env_file: .env
    volumes:
      - storage:/app/storage
    networks:
      - dokploy-network
    healthcheck:
      disable: true

  reverb:
    build: .
    restart: unless-stopped
    mem_limit: 256m
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    env_file: .env
    ports:
      - "8080"
    networks:
      - dokploy-network
    healthcheck:
      disable: true

networks:
  dokploy-network:
    external: true

volumes:
  storage: