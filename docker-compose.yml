# Só os serviços da aplicação — MySQL e Redis vivem na stack compartilhada
# "infra" (ver infra/docker-compose.yml), criada uma vez na VPS e usada por
# todos os projetos. Este compose só entra na rede "infra" pra alcançá-los
# pelos hostnames mysql/redis.

services:
  app:
    build: .
    restart: unless-stopped
    mem_limit: 512m
    env_file: .env
    ports:
      - "80"
    volumes:
      - storage:/app/storage
    networks:
      - infra

  worker:
    build: .
    restart: unless-stopped
    mem_limit: 512m
    command: php artisan horizon
    env_file: .env
    volumes:
      - storage:/app/storage
    networks:
      - infra

  scheduler:
    build: .
    restart: unless-stopped
    mem_limit: 256m
    command: php artisan schedule:work
    env_file: .env
    volumes:
      - storage:/app/storage
    networks:
      - infra

  reverb:
    build: .
    restart: unless-stopped
    mem_limit: 256m
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    env_file: .env
    ports:
      - "8080"
    networks:
      - infra

networks:
  infra:
    external: true

volumes:
  storage:
