# Serviços da aplicação. MySQL e Redis NÃO ficam aqui — são recursos nativos
# do Dokploy (tipo "Database"), criados dentro do mesmo Project pela
# interface, e o Dokploy já coloca tudo na mesma rede automaticamente. Este
# compose só precisa do host/porta deles, passados via .env.

services:
  app:
    build: .
    restart: unless-stopped
    mem_limit: 512m
    env_file: .env
    ports:
      - "80"
    volumes:
      - storage:/app/storage

  worker:
    build: .
    restart: unless-stopped
    mem_limit: 512m
    command: php artisan horizon
    env_file: .env
    volumes:
      - storage:/app/storage

  scheduler:
    build: .
    restart: unless-stopped
    mem_limit: 256m
    command: php artisan schedule:work
    env_file: .env
    volumes:
      - storage:/app/storage

  reverb:
    build: .
    restart: unless-stopped
    mem_limit: 256m
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    env_file: .env
    ports:
      - "8080"

volumes:
  storage:
