# Serviços da aplicação. MySQL e Redis são recursos nativos do Dokploy (tipo
# "Database"), e entram sozinhos na rede "dokploy-network" — um compose
# customizado como este cria sua própria rede isolada por padrão, então
# precisamos entrar explicitamente na dokploy-network pra alcançá-los.

services:
  app:
    build: .
    restart: unless-stopped
    mem_limit: 512m
    env_file: .env
    ports:
      - "80"
    volumes:
      - storage:/app/storage
    networks:
      - dokploy-network

  worker:
    build: .
    restart: unless-stopped
    mem_limit: 512m
    command: php artisan horizon
    env_file: .env
    volumes:
      - storage:/app/storage
    networks:
      - dokploy-network

  scheduler:
    build: .
    restart: unless-stopped
    mem_limit: 256m
    command: php artisan schedule:work
    env_file: .env
    volumes:
      - storage:/app/storage
    networks:
      - dokploy-network

  reverb:
    build: .
    restart: unless-stopped
    mem_limit: 256m
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    env_file: .env
    ports:
      - "8080"
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true

volumes:
  storage:
